name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run tests
        run: |
          npm ci
          npm test

      # AI tests are optional: a failure is reported as a warning but never blocks the deploy.
      # Skip them entirely by setting the repository variable RUN_AI_TESTS to "false"
      # (Settings > Secrets and variables > Actions > Variables).
      - name: Run AI tests (optional)
        if: ${{ vars.RUN_AI_TESTS != 'false' }}
        continue-on-error: true
        run: |
          npm run test:ai || { echo "::warning title=AI tests failed::The optional AI tests failed. The deploy continues."; exit 1; }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "SUPABASE_URL is not configured"
            exit 1
          }

          test -n "$SUPABASE_ANON_KEY" || {
            echo "SUPABASE_ANON_KEY is not configured"
            exit 1
          }

          URL_JSON=$(jq -Rn --arg value "$SUPABASE_URL" '$value')
          KEY_JSON=$(jq -Rn --arg value "$SUPABASE_ANON_KEY" '$value')

          cat > supabase-config.js <<EOF
          window.SUPABASE_CONFIG = {
            url: $URL_JSON,
            anonKey: $KEY_JSON
          };
          EOF

      - name: Assemble site
        run: |
          mkdir dist
          cp index.html styles.css favicon.ico supabase-config.js dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
